<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#faf9f6">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepare — prototype</title>
<style>
:root{color-scheme:light;--bg:#fbfaf8;--side:#f1efeb;--panel:#fff;--ink:#26241f;--mute:#8a857b;--line:#e2ded6;--acc:#b4532a;--accbg:#f6e6dc;--sel:#e6e1d7;--ff:Georgia,'Iowan Old Style','Kohinoor Devanagari','Devanagari Sangam MN','Noto Serif Devanagari',Mangal,serif;--ok:#2f7d4f;--okbg:#e3f1e8;--tell:#2c6aa8;--tellbg:#e3edf8;--ass:#a0701a;--assbg:#f8efd9}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--sel)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{font-size:12px;padding:2px 8px}button.ghost{border-color:transparent;background:none;color:var(--mute)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;min-height:58px;line-height:1.5}
#app{display:grid;grid-template-columns:290px 1fr;height:100vh}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .top{padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.brand{font-weight:700;font-size:15px}.brand small{font-weight:400;color:var(--mute);margin-left:6px}
.tabs{display:flex;gap:4px}.tabs button{flex:1;padding:4px 2px;font-size:12.5px}.tabs button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
#list{flex:1;overflow:auto;padding:0 6px 10px}
#list h6{margin:12px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.item:hover{background:var(--sel)}.item.sel{background:var(--accbg);color:var(--acc)}
.item small{color:var(--mute);white-space:nowrap}
#foot{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
#foot .syn{width:100%;font-size:12px;color:var(--mute);line-height:1.4}#foot .syn.ok{color:#2e6b3c}#foot .syn.warn{color:#9a4a1a}
#main{overflow:auto;padding:22px 28px 60px}
.wrap{max-width:1100px;margin:0 auto}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.head{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.head input.title{flex:1;font:700 22px Georgia,serif;border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.badge{background:var(--accbg);color:var(--acc);border-radius:10px;padding:2px 9px;font-size:12px;white-space:nowrap}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.sec h3{margin:0 0 4px;font-size:15px}.sec>p.sub{margin:0 0 10px;color:var(--mute);font-size:12.5px}
.grp{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:3px}
.q{margin:10px 0}.q label{display:block;font-weight:600;margin-bottom:4px;font-size:13.5px}
.q.done>label::after{content:" ✓";color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--sel);border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--acc);color:#fff}.master{margin:14px 0}.master .chip{border:0;font-family:inherit;padding:5px 12px;font-size:13.5px}
.chip:hover{outline:1px solid var(--acc)}.chip b{font-weight:600}.chip i{font-style:normal;color:var(--mute);font-size:11px}
.ans{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0}
.ans p{margin:0 0 4px;white-space:pre-wrap;line-height:1.5}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
a.from{color:var(--acc);cursor:pointer;border-bottom:1px dotted var(--acc)}
.ev{border-radius:10px;padding:1px 8px;font-size:11px;border:none;appearance:none;cursor:pointer}
.ev.observed{background:var(--okbg);color:var(--ok)}.ev.told{background:var(--tellbg);color:var(--tell)}.ev.assumed{background:var(--assbg);color:var(--ass)}
.addbox{margin-top:6px;padding:8px;background:var(--bg);border:1px dashed var(--line);border-radius:8px}
.addbox .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.from-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accbg);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;margin-bottom:16px}
.from-bar.none{background:var(--assbg);border-color:var(--ass)}
.answ{margin:6px 0}.answ textarea{min-height:46px}.answ.new textarea{border-style:dashed;min-height:46px}
.answ .meta{margin-top:3px}
.seedsel{max-width:220px;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer;background:var(--accbg);color:var(--acc);border:1px solid var(--acc);appearance:none;text-overflow:ellipsis}.seedsel.none{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.ev.none{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.cardsHead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.cardsHead h3{margin:0;font-size:15px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:150px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--acc)}
.icard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.14)}
.icard .ih{display:flex;gap:6px;align-items:center;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.icard .it{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.icard .iq{font:italic 13px/1.4 Georgia,serif;color:var(--acc)}
.icard ul{margin:2px 0;padding-left:16px;font-size:12.5px;color:var(--ink);flex:1}
.icard .if{font-size:11.5px;color:var(--mute);margin-top:auto}
.icard.lib{opacity:.7;border-top-color:var(--line);background:var(--bg)}.icard.lib:hover{opacity:1}
.icard.newc{border:2px dashed var(--line);border-top:2px dashed var(--line);align-items:center;justify-content:center;text-align:center;box-shadow:none;color:var(--mute);background:transparent}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:6px}
.qcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:0!important;display:flex;flex-direction:column;gap:2px}
.qcard.done{border-top-color:var(--ok)}
.qcard>label{font-size:13.5px;line-height:1.35;margin-bottom:6px}
.qcard .answ textarea{min-height:64px}
.answ textarea{resize:none}.xp{color:var(--acc)!important}
.grp{margin:22px 0 10px}
.two2{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}@media(max-width:1000px){.two2{grid-template-columns:1fr}}
.ptext{min-height:52vh;font:17px/1.7 Georgia,'Iowan Old Style',serif!important;padding:16px 18px;border-radius:8px}
.ptext[readonly]{background:var(--bg)}
.phasebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px}.phasebar i{color:var(--mute);font-style:normal}.phasebar .sp{flex:1}
.step{padding:3px 11px;border-radius:14px;background:var(--sel);color:var(--mute);font-size:12.5px}.step.past{color:var(--ink)}.step.cur{background:var(--acc);color:#fff;font-weight:600}
.lockline{font-size:13px;color:var(--mute)}.lockline b{color:var(--ink)}
.banner{background:var(--assbg);border:1px solid var(--ass);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}.banner.note{background:var(--accbg);border-color:var(--acc)}
.counter{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--mute)}
.stuck{margin:6px 0;padding-left:18px;font-size:13px}
.matscroll{max-height:46vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line);padding-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column}.stat b{font:700 26px Georgia,serif}.stat span{color:var(--mute);font-size:12.5px}
.pickbox h2{margin:2px 0 4px;font-family:Georgia,serif}.pickbox h2 small{font:400 13px -apple-system,sans-serif;color:var(--mute)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.bf{width:100%;background:var(--line);border-radius:4px 4px 0 0;min-height:2px}.bf.today{background:var(--acc)}.bar small{color:var(--mute);font-size:10.5px}
.pbar{height:8px;background:var(--sel);border-radius:4px;overflow:hidden}.pbar div{height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:6px 12px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tr[data-act]:hover td{background:var(--sel)}
.big{font:700 24px Georgia,serif;margin:2px 0 6px}.big small{font:400 12.5px -apple-system,sans-serif;color:var(--mute)}
.stat small{color:var(--mute);font-size:11.5px;margin-top:2px}
.bstack{width:100%;display:flex;flex-direction:column;min-height:2px;border-radius:4px 4px 0 0;overflow:hidden}
.bf2.piece{background:var(--acc)}.bf2.piece.today{background:var(--acc)}.bf2.prep{background:#6b8fb8}
.legend{font-size:12px;color:var(--mute)}.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 10px}.lg.piece{background:var(--acc)}.lg.prep{background:#6b8fb8}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.mbox{background:var(--panel);border-radius:12px;padding:20px 22px;min-width:340px;max-width:480px;box-shadow:0 12px 40px rgba(0,0,0,.3)}.mbox h3{margin:0 0 6px}.mbox p{margin:6px 0;color:var(--mute);line-height:1.45}.mbox input{width:100%;margin-top:8px}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;position:sticky;top:0;z-index:5}
.tbb{min-width:28px;height:28px;padding:0 7px;border:1px solid transparent;background:transparent;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:var(--ink)}
.tbb:hover{background:var(--sel)}.tbb.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}.tbb:disabled{opacity:.4;cursor:default}
.tb select{height:28px;padding:0 6px;font-size:12.5px}.tsep{width:1px;height:20px;background:var(--line);margin:0 3px}
.tcol{position:relative;overflow:hidden}.tcol input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.page{background:#fff;border:1px solid var(--line);border-radius:0 0 8px 8px}
.pedit{min-height:56vh;padding:30px 40px;outline:none;font-family:var(--ff);font-size:17px;color:#26241f;word-wrap:break-word}
.pedit:empty::before{content:attr(data-ph);color:var(--mute)}
.pedit p{margin:0 0 .8em}.pedit h1,.pedit h2,.pedit h3{font-family:var(--ff);line-height:1.25;margin:1em 0 .4em}.pedit h1{font-size:1.7em}.pedit h2{font-size:1.4em}.pedit h3{font-size:1.15em}
.pedit blockquote{margin:.8em 0;padding:2px 0 2px 16px;border-left:3px solid var(--acc);color:#555}.pedit ul,.pedit ol{margin:0 0 .8em;padding-left:1.6em}.pedit hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}.pedit a{color:var(--acc)}
.pedit[contenteditable=false]{background:var(--bg)}
.two2>div{min-width:0}.two2 .prow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}.two2 .prow select{flex:1 1 0;min-width:0;max-width:100%;width:100%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.two2 .prow button{flex:0 0 auto}
.two2.rp-narrow{grid-template-columns:minmax(0,1fr) 300px}.two2.rp-hidden{grid-template-columns:minmax(0,1fr)}.two2.rp-hidden>div:nth-child(2){display:none}.sidesel{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:var(--panel);color:var(--mute);cursor:pointer}
.two2.focus{grid-template-columns:minmax(0,860px);justify-content:center}.two2.focus>div:nth-child(2){display:none}
#printArea{display:none;font-family:var(--ff)}
@media print{body{overflow:visible;background:#fff}#app,#toast,#modal{display:none!important}#printArea{display:block;font:12pt/1.6 var(--ff);color:#000}#printArea h1{font-size:20pt}}
#app.pfocus{grid-template-columns:1fr}#app.pfocus #side{display:none}#app.pfocus #main{padding:0;overflow:hidden}
.fx{height:100vh;display:flex;flex-direction:column}
.fxbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}.fxbar .fxt{font-weight:600;color:var(--ink)}
.fx .tb{position:static;border-radius:0;border-left:none;border-right:none;justify-content:center}
.fxscroll{flex:1;overflow:auto;padding:22px 16px 60px;background:var(--bg)}
.fxscroll .page{max-width:840px;margin:0 auto;border-radius:8px;border-top:1px solid var(--line)}.fx .pedit{min-height:calc(100vh - 210px)}
.hpill{position:fixed;right:16px;bottom:16px;z-index:50;border-radius:20px;padding:6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-weight:600}
.hpop{position:fixed;right:16px;bottom:16px;width:380px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:14px 16px;z-index:90}
.hpop h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}.hpop ol{margin:0;padding-left:18px;font-size:13px;line-height:1.5}.hpop li{margin-bottom:5px}
.hgrid{display:flex;flex-wrap:wrap;gap:4px}.hgrid button{min-width:34px;height:34px;padding:0 6px;font-size:17px;font-family:var(--ff)}
.selbox{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:4px 0}.hint.ex{color:var(--ok)}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:0 0 auto}.row input{flex:1;min-width:140px}
.prod{border-top:1px solid var(--line);padding:8px 0}.prod:first-child{border-top:none}
.prod .who{font-weight:600}.prod .qq{color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:30px;text-align:center}
.sheet h2{font-family:Georgia,serif;margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sheet h4{margin:12px 0 2px;font-size:13px;color:var(--mute)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="top">
      <div class="brand">✒︎ Prepare<small>prototype</small></div>
      <div class="tabs"><button data-act="tab" data-t="seeds">Seeds</button><button data-act="tab" data-t="cards">Cards</button><button data-act="tab" data-t="pieces">Pieces</button><button data-act="tab" data-t="progress">Progress</button></div>
      <input id="filter" placeholder="Filter…">
      <div id="newbtn"></div>
    </div>
    <div id="list"></div>
    <div id="foot">
      <div id="syncbox" style="width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center"></div>
      <button class="sm" data-act="export">Export JSON</button>
      <button class="sm" data-act="sample">Reset to sample</button>
      <button class="sm" data-act="blank">Start blank</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<button id="hpill" class="hpill" data-act="hindi" title="Hindi typing help and characters">हिं Hindi</button>
<div id="printArea"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function ask(o){return new Promise(res=>{const m=document.createElement('div');m.id='modal';
  m.innerHTML=`<div class="mbox"><h3>${esc(o.title||'')}</h3>${o.message?`<p>${esc(o.message)}</p>`:''}${o.input?`<input id="mIn" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}">`:''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button data-m="no">${esc(o.cancel||'Cancel')}</button><button class="pri" data-m="ok">${esc(o.ok||'OK')}</button></div></div>`;
  document.body.appendChild(m);const inp=m.querySelector('#mIn');if(inp){inp.focus();inp.select()}else m.querySelector('[data-m=ok]').focus();
  const done=v=>{m.remove();res(v)};
  m.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='ok'?(o.input?(inp.value.trim()||null):true):(o.input?null:false));else if(e.target===m)done(o.input?null:false)});
  m.addEventListener('keydown',e=>{if(e.key==='Enter'&&(inp||document.activeElement.dataset.m!=='no')){e.preventDefault();m.querySelector('[data-m=ok]').click()}else if(e.key==='Escape'){done(o.input?null:false)}})})}
function dl(name,mime,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2000)}

/* ================= THE QUESTIONS ================= */
const COMMON=[{h:'For every card',qs:['Why did this catch me?','For later (metaphors, leftovers, things to come back to)']}];
const CARD_TYPES={
person:{label:'Person',icon:'🧑',groups:[
 {h:'What you can see and hear',qs:['What do they look like, and how do they dress?','How do they move and carry themselves? Any tics?','What\'s their routine, and where do they go?','What work do they do, and who do they deal with?','How do they talk? Exact phrases, rhythm and words they favour.','What object do they always have or keep?']},
 {h:'What you know or can find out',qs:['Where are they from? What do you know of their family and upbringing?','What\'s their class background, and where are they now?','What turning points in their life do you actually know of?','What do other people say about them?','How are they connected to you, and how did you meet?']},
 {h:'Inner life, as evidence',qs:['What do they say they want?','What do they complain about?','Where have you seen their actions contradict their words?','How have you seen them treat people with more power, and with less?','What have you seen them do when they thought nobody was watching?','What do they avoid or hide?']}]},
place:{label:'Place',icon:'📍',groups:[{h:'The place',qs:['What is it called, and how do you get there?','What do you see first on arriving? How is it laid out?','How does it change by time of day, day of the week, or season?','What are its sounds, smells and temperature?','Who is there: regulars, workers, people passing through?','What happens there: routines, rush hours, rituals?','What are its rules, written and unwritten?','What words are visible: signs, names, prices, notices?','What did it used to be, and what has changed?','What\'s your history with it: the first visit, how often, with whom?','What\'s out of place there?','What would a stranger misread about it?']}]},
object:{label:'Object',icon:'🧰',groups:[{h:'The object',qs:['What is it? One literal sentence, no comparison.','Size, shape, material, colour, texture, weight.','What can you smell, hear or feel from it?','Whose is it, and how did they get it?','What is it used for, and how is it actually used? Does the use differ from the purpose?','Where is it kept, and who touches it?','What marks of history does it carry: wear, repairs, damage, writing, labels?','What is its value, in money or in feeling, and to whom?','What would change if it were gone?','Where else have you seen it, or things like it?']}]},
idea:{label:'Idea',icon:'💡',groups:[

function textToHtml(t){return (t||'').split(/\n{2,}/).filter(x=>x.length).map(par=>'<p>'+esc(par).replace(/\n/g,'<br>')+'</p>').join('')}

function cleanHTML(h){const doc=new DOMParser().parseFromString(h,'text/html');
  const OK={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',H1:'h1',H2:'h2',H3:'h3',H4:'h3',H5:'h3',H6:'h3',P:'p',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote',BR:'br',HR:'hr'};
  const walk=n=>{if(n.nodeType===3)return esc(n.nodeValue);if(n.nodeType!==1)return '';const t=n.tagName;
    if(['SCRIPT','STYLE','META','LINK','HEAD','TITLE'].includes(t))return '';
    const inner=[...n.childNodes].map(walk).join('');
    if(t==='A'){const hr=n.getAttribute('href')||'';return /^(https?:|mailto:)/i.test(hr)?`<a href="${esc(hr)}">${inner}</a>`:inner}
    if(t==='DIV')return inner.trim()?`<p>${inner}</p>`:'';
    if(t==='SPAN'){const st=n.getAttribute('style')||'';let r=inner;if(/font-weight:\s*(bold|[6-9]00)/i.test(st))r=`<b>${r}</b>`;if(/font-style:\s*italic/i.test(st))r=`<i>${r}</i>`;if(/text-decoration[^;]*underline/i.test(st))r=`<u>${r}</u>`;if(/text-decoration[^;]*line-through/i.test(st))r=`<s>${r}</s>`;return r}
    const tag=OK[t];if(!tag)return inner;if(tag==='br'||tag==='hr')return `<${tag}>`;
    if((t==='B'||t==='STRONG')&&/font-weight:\s*(normal|400)/i.test(n.getAttribute('style')||''))return inner;
    return `<${tag}>${inner}</${tag}>`};
  return [...doc.body.childNodes].map(walk).join('')}

async function pull(libCards){const sd=await dirH.getDirectoryHandle('seeds',{create:true});const changed=new Set();const base=db.syncBase=db.syncBase||{};db.tomb=db.tomb||{};

    return{rest:L,why:`“${L.title}” is resting until ${fmtD(restUntil(L))}. It hasn't reached ${LOCK.toLocaleString()} words yet, so no new piece today. Use the time for your seeds and cards.`}}
  const work=activeP().filter(p=>p.phase!=='done'&&!resting(p));
  work.sort((a,b)=>ORDER.indexOf(b.phase)-ORDER.indexOf(a.phase)||(a.phaseSince||'').localeCompare(b.phaseSince||''));

  const B=(cmd,label,title,val)=>`<button type="button" class="tbb" data-act="fmt" data-cmd="${cmd}" ${val?`data-val="${val}"`:''} title="${title}" ${ro?'disabled':''}>${label}</button>`;

   ${B('bold','<b>B</b>','Bold (⌘B)')}${B('italic','<i>I</i>','Italic (⌘I)')}${B('underline','<u>U</u>','Underline (⌘U)')}${B('strikeThrough','<s>Cross out</s>','Cross out text (⌘⇧X). Crossed-out words still count as written; deleted words do not.')}
   <label class="tbb tcol" title="Text colour"><span style="border-bottom:3px solid var(--acc)">A</span><input type="color" data-bind="fmtcolor" value="#b4532a" ${ro?'disabled':''}></label>

   ${B('justifyLeft',al('l',[[1,15],[1,10],[1,15],[1,9]]),'Align left')}${B('justifyCenter',al('c',[[1,15],[4,12],[1,15],[5,11]]),'Centre')}${B('justifyRight',al('r',[[1,15],[6,15],[1,15],[7,15]]),'Align right')}${B('justifyFull',al('j',[[1,15],[1,15],[1,15],[1,15]]),'Justify')}<span class="tsep"></span>
   ${B('insertUnorderedList','• List','Bulleted list')}${B('insertOrderedList','1. List','Numbered list')}${B('outdent','⇤','Decrease indent')}${B('indent','⇥','Increase indent')}<span class="tsep"></span>

   <select data-bind="fmtmg" title="Side margins">${Object.entries(MARGINS).map(([v,l])=>`<option value="${v}" ${db.prefs.mg===v?'selected':''}>${l} margins</option>`).join('')}</select>
   <select data-bind="fmtlh" title="Line spacing">${[['1.4','Tight'],['1.7','Normal'],['2','Roomy']].map(([v,l])=>`<option value="${v}" ${db.prefs.lh===v?'selected':''}>${l} spacing</option>`).join('')}</select>
   <button type="button" class="tbb ${db.prefs.spell?'on':''}" data-act="togspell" title="Spellcheck on or off">Spellcheck</button><button type="button" class="tbb ${ui.pFocus?'on':''}" data-act="togfocus" title="Full-screen writing: only the editor">Focus</button><button type="button" class="tbb" data-act="hindi" title="Hindi typing help and Devanagari characters">हिं Hindi</button></div>`;
  const pageHTML=`<div class="page"><div id="ptext" class="pedit" contenteditable="${ro?'false':'true'}" data-bind="piecehtml" data-ph="${ro?'Read only in the close read.':'Start writing…  English or हिन्दी'}" spellcheck="${db.prefs.spell}" style="line-height:${db.prefs.lh};padding-left:${db.prefs.mg}px;padding-right:${db.prefs.mg}px">${edHtml}</div></div>`;
  const writer=`${tb}${pageHTML}`;
  if(ui.pFocus)return `<div class="fx"><div class="fxbar"><span class="fxt">${esc(p.title)}</span><span class="fxinfo"><b id="pwc">${w.toLocaleString()}</b> words</span><button data-act="togfocus">Exit focus (Esc)</button></div>${tb}<div class="fxscroll">${pageHTML}</div></div>`;

  <div class="phasebar"><span id="steps">${stepsHTML(p)}</span><span class="sp"></span><select class="sidesel" data-bind="sidepanel" title="The Brief and Material column on the right">${[['wide','Side panel: wide'],['narrow','Side panel: narrow'],['hidden','Side panel: hidden']].map(([v,l])=>`<option value="${v}" ${db.prefs.side===v?'selected':''}>${l}</option>`).join('')}</select><span class="lockline">${lock}</span></div>

     <div class="row" style="margin-top:8px"><button class="sm" data-act="draftdoc" data-id="${p.id}">Download .doc (Word, Pages)</button><button class="sm" data-act="drafttxt" data-id="${p.id}">Download .txt</button><button class="sm" data-act="draftpdf" data-id="${p.id}">Print / save as PDF</button></div>
     ${p.phase==='close'||p.phase==='edit'?`<div class="q" style="margin-top:12px"><label>Marks: where does it fail?</label><textarea data-bind="piecemarks" placeholder="Note the places that fail. Don't fix them yet.">${esc(p.marks||'')}</textarea></div>`:''}

     <div class="q"><label>Note for next time (optional)</label><textarea data-bind="piecenote">${esc(p.note||'')}</textarea></div>
     <div class="row" id="outs">${outsHTML(p)}</div></div>
  </div><div>

     <div class="q"><label>Narrator persona</label><select data-bind="persona" style="width:100%">${personaOpts}</select>${p.persona?`<div class="hint">${esc(PERSONAS[p.persona][1])}</div>`:''}</div>
     <div class="q"><label>Premise: what will the persona chase?</label><textarea data-bind="premise">${esc(p.premise||'')}</textarea></div>

     <div class="chips">${seeds.map(s=>`<span class="chip" data-act="unpull" data-w="seeds" data-pid="${p.id}" data-id="${s.id}" title="Click to remove">${esc(seedLabel(s))} ✕</span>`).join('')}${cards.map(c=>`<span class="chip" data-act="unpull" data-w="cards" data-pid="${p.id}" data-id="${c.id}" title="Click to remove">${CARD_TYPES[c.type].icon} ${esc(c.name)} ✕</span>`).join('')}</div>
     <div class="matscroll">${sheet}</div>
     <div class="row" style="margin-top:8px"><button class="sm" data-act="sheetmd" data-id="${p.id}">Download material as text</button></div></div>
  </div></div></div>`;

const dName=d=>d===TODAY()?'Today':d===add(TODAY(),-1)?'Yesterday':fmtD(d);
function dayPanel(){
  const d=ui.day||defaultDay(),S=dayStats(d);
  const isDef=!ui.day;
  const head=`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">${dName(d)} <small style="font-weight:400;color:var(--mute)">${fmtD(d)}${isDef&&d!==add(TODAY(),-1)?' · last day you worked':''}</small></h3><span class="row"><button class="sm" data-act="daymove" data-d="-1">◀ Earlier</button><button class="sm" data-act="daymove" data-d="y">Yesterday</button><button class="sm" data-act="daymove" data-d="1" ${d>=TODAY()?'disabled':''}>Later ▶</button></span></div>`;
  if(!S.any)return `<div class="sec">${head}<div class="hint">Nothing was logged on this day.</div></div>`;
  const pRows=S.pe.filter(e=>e.words>0||e.outcome).map(e=>{const pc=pieceById(e.piece||e.ref);return `<div class="prod"><span class="who">📄 ${esc(pc?pc.title:(e.title||'(deleted piece)'))}</span> <span class="qq">· ${PHASES[e.phase]?PHASES[e.phase].short:e.phase}</span><div>${e.words.toLocaleString()} words · ${mins(e.secs)} min${e.outcome?` · ended as <b>${esc((PHASES[e.phase].outcomes||{})[e.outcome]||e.outcome)}</b>`:''}${pc?` · now in ${PHASES[pc.phase].short}`:''}</div>${e.note?`<div class="hint">Note for next time: ${esc(e.note)}</div>`:''}</div>`}).join('')||'<div class="hint">No piece writing.</div>';
  const sRows=S.se.filter(e=>e.words>0).map(e=>`<div class="prod"><span class="who">🌱 ${esc(seedById(e.ref)?seedName(seedById(e.ref)):(e.title||'seed'))}</span><div>${e.words.toLocaleString()} words · ${mins(e.secs)} min</div></div>`).join('');
  const cRows=S.ce.filter(e=>e.words>0).map(e=>{const c=cardById(e.ref);return `<div class="prod"><span class="who">${c?CARD_TYPES[c.type].icon:'🗂'} ${esc(c?c.name:(e.title||'card'))}</span><div>${e.words.toLocaleString()} words · ${mins(e.secs)} min</div></div>`}).join('');
  const chips=[['seed started','seeds started',S.seeds],['card created','cards created',S.cardsNew],['card reused','cards reused',S.reused],['answer written','answers written',S.answers],['quote marked','quotes marked',S.quotes],['item pulled into a piece','items pulled into pieces',S.pulls]].filter(x=>x[2]).map(x=>`<span class="chip">${x[2]} ${x[2]===1?x[0]:x[1]}</span>`).join('');
  return `<div class="sec">${head}
   <div class="two" style="gap:22px"><div><div class="eyebrow">Writing pieces</div><div class="big">${S.pw.toLocaleString()} <small>words · ${mins(S.ps)} min</small></div>${pRows}</div>
   <div><div class="eyebrow">Prep (seeds and cards)</div><div class="big">${S.prepW.toLocaleString()} <small>words · ${mins(S.prepS)} min</small></div>${sRows}${cRows}${chips?`<div class="chips">${chips}</div>`:''}${(!sRows&&!cRows&&!chips)?'<div class="hint">No prep.</div>':''}</div></div></div>`;
}
function progressView(){
  const pk=pick(),T=dayStats(TODAY()),Y=dayStats(add(TODAY(),-1)),st=streak(),pl=pipeline();
  const days=[];for(let i=13;i>=0;i--)days.push(dayStats(add(TODAY(),-i)));
  const mx=Math.max(1,...days.map(x=>x.pw+x.prepW));
  const bars=days.map(x=>`<div class="bar" title="${fmtD(x.d)}: ${x.pw.toLocaleString()} piece words · ${x.prepW.toLocaleString()} prep words"><div class="bstack" style="height:${Math.round((x.pw+x.prepW)/mx*100)}%"><div class="bf2 prep" style="flex:${x.prepW}"></div><div class="bf2 piece ${x.d===TODAY()?'today':''}" style="flex:${x.pw}"></div></div><small>${P(x.d).getDate()}</small></div>`).join('');
  const vs=(a,b)=>a===b?'same as yesterday':(a>b?`▲ ${(a-b).toLocaleString()} more than yesterday`:`▼ ${(b-a).toLocaleString()} fewer than yesterday`);
  const pieces=db.pieces.map(p=>{const w=wcount(p),pct=Math.min(100,Math.round(w/LOCK*100)),r=resting(p),sess=new Set(db.log.filter(e=>e.piece===p.id&&e.words>0).map(e=>e.date)).size,last=db.log.filter(e=>e.piece===p.id).map(e=>e.date).sort().pop();
    return `<tr data-act="open" data-k="pieces" data-id="${p.id}" style="cursor:pointer"><td><b>${esc(p.title)}</b>${p.status==='published'?' <span class="chip">published</span>':''}</td><td>${PHASES[p.phase].short}${r?' · resting to '+fmtD(restUntil(p)):''}</td><td>${w.toLocaleString()}</td><td style="width:160px"><div class="pbar"><div style="width:${pct}%"></div></div><small>${pct}% of ${LOCK.toLocaleString()}</small></td><td>${sess}</td><td>${last?fmtD(last):'—'}</td></tr>`}).join('');
  const drows=days.filter(x=>x.any).reverse().map(x=>`<tr><td>${fmtD(x.d)}</td><td>${x.pw.toLocaleString()}</td><td>${x.prepW.toLocaleString()}</td><td>${mins(x.ps+x.prepS)} <small style="color:var(--mute)">(${mins(x.ps)} piece · ${mins(x.prepS)} prep)</small></td><td>${x.seeds}</td><td>${x.cardsNew}</td><td>${x.reused}</td><td>${x.answers}</td></tr>`).join('');
  const rows=[...db.log].sort((a,b)=>b.date.localeCompare(a.date)||(b.secs-a.secs)).filter(e=>e.words>0||e.outcome).slice(0,60).map(e=>{const ar=e.area||'piece';let nm,kind;
    if(ar==='piece'){const pc=pieceById(e.piece||e.ref);nm=pc?pc.title:(e.title||'(deleted piece)');kind='📄 '+(PHASES[e.phase]?PHASES[e.phase].short:'')}
    else if(ar==='seed'){const sd=seedById(e.ref);nm=sd?seedName(sd):(e.title||'seed');kind='🌱 Seed'}
    else{const c=cardById(e.ref);nm=c?c.name:(e.title||'card');kind=(c?CARD_TYPES[c.type].icon:'🗂')+' Card'}
    return `<tr><td>${fmtD(e.date)}</td><td>${esc(nm)}</td><td>${kind}</td><td>${e.words.toLocaleString()}</td><td>${mins(e.secs)}</td><td>${e.outcome?esc(((PHASES[e.phase]||{}).outcomes||{})[e.outcome]||e.outcome):''}</td><td>${esc(e.note||'')}</td></tr>`}).join('');
  const todayBox=`<div class="sec pickbox"><div class="eyebrow">What to work on</div>${pk.piece?`<h2>${esc(pk.piece.title)} <small>${PHASES[pk.piece.phase].label}</small></h2><p>${esc(pk.why)}</p><button class="pri" data-act="open" data-k="pieces" data-id="${pk.piece.id}">Open piece</button>`:pk.rest?`<h2>Rest today</h2><p>${esc(pk.why)}</p><button data-act="open" data-k="pieces" data-id="${pk.rest.id}">Open “${esc(pk.rest.title)}”</button>`:`<h2>${pk.start?'Start a new piece':'Nothing yet'}</h2><p>${esc(pk.why)}</p>${pk.start?'<button class="pri" data-act="tab" data-t="pieces">Go to Pieces</button>':''}`}</div>`;
  const pipe=`<div class="sec"><h3>Prep pipeline</h3><p class="sub">Where your research stands right now.</p><div class="stats" style="margin:0">
    <div class="stat"><b>${pl.seedsWaiting}</b><span>seeds not yet turned into cards (of ${pl.seeds})</span></div>
    <div class="stat"><b>${pl.cover}%</b><span>of card questions answered (${pl.ans} of ${pl.tot})</span></div>
    <div class="stat"><b>${pl.emptyCards}</b><span>cards with no answers (of ${pl.cards})</span></div>
    <div class="stat"><b>${pl.reusedCards}</b><span>cards used by 2+ seeds</span></div>
    <div class="stat"><b>${pl.used}</b><span>cards feeding a piece</span></div></div></div>`;
  return `<div class="wrap"><div class="head"><span class="badge">📈 Progress</span><h2 style="margin:0;font-family:Georgia,serif">Your work, tracked automatically</h2></div>
  <div class="stats"><div class="stat"><b>${T.pw.toLocaleString()}</b><span>piece words today</span><small>${vs(T.pw,Y.pw)}</small></div><div class="stat"><b>${T.prepW.toLocaleString()}</b><span>prep words today</span><small>${vs(T.prepW,Y.prepW)}</small></div><div class="stat"><b>${mins(T.ps+T.prepS)}</b><span>minutes today</span><small>${mins(T.ps)} piece · ${mins(T.prepS)} prep</small></div><div class="stat"><b>${st}</b><span>day streak (any work)</span></div></div>
  ${todayBox}
  ${dayPanel()}
  <div class="sec"><div class="row" style="justify-content:space-between"><h3>Last 14 days</h3><span class="legend"><i class="lg piece"></i> piece words <i class="lg prep"></i> prep words</span></div><div class="bars">${bars}</div></div>
  ${pipe}
  <div class="sec"><h3>Day by day</h3>${drows?`<table><tr><th>Date</th><th>Piece words</th><th>Prep words</th><th>Time (min)</th><th>Seeds</th><th>Cards new</th><th>Cards reused</th><th>Answers</th></tr>${drows}</table>`:'<div class="hint">Nothing logged yet.</div>'}</div>
  <div class="sec"><h3>Pieces</h3>${pieces?`<table><tr><th>Piece</th><th>Phase</th><th>Words</th><th>Toward ${LOCK.toLocaleString()}</th><th>Days written</th><th>Last</th></tr>${pieces}</table>`:'<div class="hint">No pieces yet.</div>'}</div>
  <div class="sec"><h3>Session log</h3>${rows?`<table><tr><th>Date</th><th>Item</th><th>Kind</th><th>Words</th><th>Min</th><th>Ended as</th><th>Note</th></tr>${rows}</table>`:'<div class="hint">Nothing logged yet. Write a seed, answer a card question or write in a piece and it will appear here.</div>'}</div></div>`;
}

/* ================= ACTIONS ================= */
function hint(){
  const t=$('#dType'),n=$('#dName'),dl=$('#dl'),h=$('#dHint');if(!t||!n)return;if(!t.value){dl.innerHTML='';h.textContent='';h.className='hint';return}
  dl.innerHTML=db.cards.filter(c=>c.type===t.value).flatMap(c=>[c.name,...(c.aliases||[])]).map(x=>`<option value="${esc(x)}">`).join('');
  const v=n.value.trim();
  if(!v){h.textContent='';h.className='hint';return}
  const ex=findCard(t.value,v);
  h.className='hint '+(ex?'ex':'');
  h.textContent=ex?`✓ Existing card “${ex.name}” — you will add to it (${ex.answers.length} answers so far).`:'New card will be created.';
}
function toMd(p){
  const out=['# '+p.title,''];
  p.seeds.map(seedById).filter(Boolean).forEach(s=>{out.push('## Seed: '+seedName(s),'',s.text||'','');if(s.why)out.push('**Why did this catch me?**',s.why,'');if(s.later)out.push('**For later**',s.later,'');DIG.forEach((q,i)=>{if(s.dig&&s.dig[i])out.push('**'+q+'**',s.dig[i],'')})});

function restoreSel(){const ed=$('#ptext');if(!ed)return;ed.focus();if(savedRange){const sel=getSelection();sel.removeAllRanges();sel.addRange(savedRange)}}
function syncEd(){const ed=$('#ptext');if(ed)ed.dispatchEvent(new Event('input',{bubbles:true}))}
function updateTb(){const tb=$('#tb');if(!tb)return;tb.querySelectorAll('[data-cmd]').forEach(b=>{const c=b.dataset.cmd;if(['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'].includes(c)){let on=false;try{on=document.queryCommandState(c)}catch(e){}b.classList.toggle('on',on)}});
  const sel=tb.querySelector('[data-bind=fmtblock]');if(sel){let v='p';try{v=(document.queryCommandValue('formatBlock')||'p').toLowerCase().replace(/[<>]/g,'')}catch(e){}sel.value=['h1','h2','h3','blockquote'].includes(v)?v:'p'}}
document.addEventListener('selectionchange',()=>{const ed=$('#ptext'),sel=getSelection();if(ed&&sel.rangeCount&&ed.contains(sel.anchorNode)){savedRange=sel.getRangeAt(0).cloneRange();updateTb()}});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#tb'))return;const ed=$('#ptext'),sel=getSelection();if(ed&&sel.rangeCount&&ed.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange();if(e.target.closest('.tbb')&&!e.target.closest('input'))e.preventDefault()});
document.addEventListener('paste',e=>{const ed=$('#ptext');if(!ed||!ed.contains(e.target)||ed.contentEditable==='false')return;e.preventDefault();
  const h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');trk.pasted=true;document.execCommand('insertHTML',false,h?cleanHTML(h):textToHtml(t))},true);
try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&ui.pFocus){ui.pFocus=false;render()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='x'&&document.activeElement&&document.activeElement.id==='ptext'){e.preventDefault();document.execCommand('strikeThrough');updateTb();return}if(e.key==='Escape'&&ui.pFocus&&!$('#modal')){ui.pFocus=false;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});render()}});
function grabSel(e){const t=e.target;if(!t||t.id!=='seedtext')return;
  const sel=t.value.slice(t.selectionStart,t.selectionEnd).replace(/\s+/g,' ').trim();
  if(!sel)return;ui.excerpt=sel;
  const b=$('#selBox');if(b)b.innerHTML='Linked to your words: “'+esc(sel)+'” <a class="from" data-act="clearsel">clear</a>';
}
['select','mouseup','keyup'].forEach(ev=>document.addEventListener(ev,grabSel,true));
const ANS_CAP=128;

  const big=full>ANS_CAP+6;const open=!!(aid&&ui.exp[aid]);
  t.style.height=(big&&!open?ANS_CAP:full)+'px';t.style.overflowY=big&&!open?'auto':'hidden';
  const b=w&&w.querySelector('.xp');if(b){b.style.display=big?'':'none';b.textContent=open?'Collapse ▴':'Expand ▾'}}
function fitAnswers(){document.querySelectorAll('.answ textarea').forEach(autosize)}
window.addEventListener('resize',()=>{clearTimeout(fitAnswers.h);fitAnswers.h=setTimeout(fitAnswers,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAnswers);

render();initFolder();
